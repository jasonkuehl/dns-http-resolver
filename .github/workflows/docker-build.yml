name: Build & Push Docker

on:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "app_version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.yolo.fail
          # Gitea 1.27's registry rejects the job token (it gets no package scope), so log in with a
          # package-only personal access token stored as the user-level Actions secret REGISTRY_TOKEN
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: git.yolo.fail/${{ github.repository_owner }}/dns-resolver
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}

      # Gitea doesn't link container images to their repository by itself, so link this one and it
      # shows under the repo's Packages tab. 201 = linked now, 400 = already linked (both fine).
      - name: Link image to this repository
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          PACKAGE: dns-resolver
        run: |
          name="$PACKAGE"
          repo="${GITHUB_REPOSITORY#*/}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: token $TOKEN" \
            "${{ github.api_url }}/packages/${{ github.repository_owner }}/container/$name/-/link/$repo")
          case "$code" in
            201) echo "Linked $name to $repo" ;;
            400) echo "$name is already linked" ;;
            *)   echo "::error::Linking $name to $repo failed (HTTP $code)"; exit 1 ;;
          esac

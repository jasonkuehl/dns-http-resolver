name: Auto Version & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    # Skip if the push was from this workflow (prevent loops)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: https://git.yolo.fail/actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current version
        id: current
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Determine bump type from commit message
        id: bump
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -qiE '\[major\]'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qiE '\[minor\]'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qiE '\[patch\]'; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "type=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        if: steps.bump.outputs.type != 'none'
        id: next
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.current.outputs.version }}"
          case "${{ steps.bump.outputs.type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          NEW_VERSION="${major}.${minor}.${patch}"
          echo "$NEW_VERSION" > VERSION
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.bump.outputs.type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.next.outputs.version }} [skip ci]"
          git push

      - name: Create Gitea Release
        if: steps.bump.outputs.type != 'none'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.next.outputs.version }}"
          PREVIOUS=$(git describe --tags --abbrev=0 2>/dev/null || true)
          git tag "$VERSION"
          git push origin "$VERSION"

          # Gitea has no --generate-notes, so list the commits since the previous tag
          NOTES=$(git log --pretty='- %s (%h)' ${PREVIOUS:+"$PREVIOUS"..}HEAD)
          jq -n --arg tag "$VERSION" --arg body "$NOTES" '{tag_name: $tag, name: $tag, body: $body}' |
            curl -fsS -X POST "${{ github.api_url }}/repos/${{ github.repository }}/releases" \
              -H "Authorization: token $TOKEN" -H "Content-Type: application/json" -d @-

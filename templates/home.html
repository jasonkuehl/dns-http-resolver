<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNS Resolver - Home</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
  </style>
</head>
<body>
  {% include '_header.html' %}

  <div class="main-container">
    <h1>🌐 DNS Resolver</h1>
    <p>A powerful DNS lookup tool with multi-server comparison, DNSSEC validation, and real-time trace visualization.</p>

    <details class="curl-example">
      <summary>💻 curl example</summary>
      <pre>curl "http://localhost:60200/api/resolve?domain=example.com&type=A" | jq</pre>
    </details>

    <form id="quick-form">
      <div class="form-group-inline">
        <label>Domain:</label>
        <input type="text" id="quick-domain" placeholder="example.com" required>
        <label>Type:</label>
        <select id="quick-type">
          <option value="A">A</option>
          <option value="AAAA">AAAA</option>
          <option value="MX">MX</option>
          <option value="NS">NS</option>
          <option value="TXT">TXT</option>
          <option value="SOA">SOA</option>
          <option value="CAA">CAA</option>
          <option value="ALL">ALL</option>
        </select>
        <button type="submit">Lookup</button>
      </div>
    </form>
  </div>

  {% include '_footer.html' %}

  <script>
    document.getElementById('quick-form').onsubmit = function(e) {
      e.preventDefault();
      const domain = document.getElementById('quick-domain').value.trim();
      const type = document.getElementById('quick-type').value;
      if (domain) {
        window.location.href = `/resolve?domain=${encodeURIComponent(domain)}&type=${type}`;
      }
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNS Trace</title>
  <link rel="stylesheet" href="/static/css/style.css">
  
  <style>
    #trace-output {
      margin-top: 20px;
    }

    .trace-step {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--accent);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      position: relative;
    }

    .trace-step::before {
      content: '';
      position: absolute;
      left: -2px;
      top: 100%;
      width: 2px;
      height: 16px;
      background: var(--border-subtle);
    }

    .trace-step:last-child::before {
      display: none;
    }

    .trace-step.authoritative {
      border-left-color: var(--accent-ok);
    }

    .trace-step.error {
      border-left-color: var(--accent-error);
    }

    .trace-step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .trace-step h3 {
      margin: 0;
      font-size: 16px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trace-step h3 .step-num {
      background: var(--accent);
      color: var(--bg-main);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .trace-meta {
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .trace-meta .badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-ok {
      background: rgba(46, 160, 67, 0.2);
      color: var(--accent-ok);
    }

    .badge-auth {
      background: rgba(88, 166, 255, 0.2);
      color: var(--accent);
    }

    .badge-error {
      background: rgba(248, 81, 73, 0.2);
      color: var(--accent-error);
    }

    .trace-section {
      margin-top: 12px;
    }

    .trace-section-title {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .trace-records {
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 10px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }

    .trace-record {
      padding: 4px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .trace-record:last-child {
      border-bottom: none;
    }

    .trace-record .type {
      color: var(--accent);
      font-weight: bold;
      min-width: 50px;
      display: inline-block;
    }

    .trace-record .ttl {
      color: var(--text-muted);
      font-size: 11px;
    }

    #searching-message {
      text-align: center;
      margin-top: 20px;
      padding: 20px;
      background: var(--bg-panel);
      border-radius: 8px;
      display: none;
    }

    .trace-summary {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .summary-stat {
      text-align: center;
    }

    .summary-stat .value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
    }

    .summary-stat .label {
      font-size: 12px;
      color: var(--text-muted);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

{% include '_header.html' %}

<div class="main-container">
  <h1>🧭 DNS Trace</h1>
  <p>Enter a domain and click <strong>Trace</strong> to visualize the DNS resolution path from root servers to authoritative nameservers.</p>

  <form id="trace-form">
    <div class="form-group-inline">
      <label>Domain:</label>
      <input id="trace-domain" type="text" placeholder="example.com" required>
      <button id="trace-btn" type="submit">Trace</button>
    </div>
  </form>

  <div id="searching-message">
    <span class="loader"></span>
    <span>Tracing DNS resolution path…</span>
  </div>

  <div id="trace-summary" style="display: none;"></div>
  <div id="trace-output"></div>
</div>

{% include '_footer.html' %}

<script>
document.getElementById("trace-form").onsubmit = async function(e) {
  e.preventDefault();
  document.getElementById("trace-output").innerHTML = "";
  document.getElementById("trace-summary").style.display = "none";
  document.getElementById("searching-message").style.display = "block";

  const domain = document.getElementById("trace-domain").value.trim();
  if (!domain) {
    document.getElementById("searching-message").style.display = "none";
    return;
  }

  let response;
  try {
    response = await fetch(`/api/trace?domain=${encodeURIComponent(domain)}`);
  } catch (err) {
    document.getElementById("searching-message").style.display = "none";
    document.getElementById("trace-output").innerHTML = `<div class="status-error">Error: ${err.message}</div>`;
    return;
  }

  let data;
  try {
    data = await response.json();
  } catch (err) {
    document.getElementById("searching-message").style.display = "none";
    document.getElementById("trace-output").innerHTML = `<div class="status-error">Invalid JSON response</div>`;
    return;
  }

  document.getElementById("searching-message").style.display = "none";

  if (data.error) {
    document.getElementById("trace-output").innerHTML = `<div class="status-error">Error: ${data.error.message || data.error}</div>`;
    return;
  }

  if (!data.trace || !data.trace.length) {
    document.getElementById("trace-output").innerHTML = "<div class='status-error'>No trace data found.</div>";
    return;
  }

  // Calculate summary stats
  const totalSteps = data.trace.length;
  const totalLatency = data.trace.reduce((sum, s) => sum + (s.latency_ms || 0), 0);
  const hasAuth = data.trace.some(s => s.is_authoritative);
  const hasErrors = data.trace.some(s => s.error);

  // Render summary
  const summaryEl = document.getElementById("trace-summary");
  summaryEl.innerHTML = `
    <div class="trace-summary">
      <div class="summary-stat">
        <div class="value">${totalSteps}</div>
        <div class="label">Hops</div>
      </div>
      <div class="summary-stat">
        <div class="value">${totalLatency.toFixed(0)}ms</div>
        <div class="label">Total Time</div>
      </div>
      <div class="summary-stat">
        <div class="value">${hasAuth ? '✅' : '⏳'}</div>
        <div class="label">${hasAuth ? 'Resolved' : 'Incomplete'}</div>
      </div>
    </div>
  `;
  summaryEl.style.display = "block";

  // Render trace steps
  const output = document.getElementById("trace-output");
  data.trace.forEach((step, idx) => {
    const wrapper = document.createElement("div");
    wrapper.className = "trace-step" + (step.is_authoritative ? " authoritative" : "") + (step.error ? " error" : "");

    // Header
    const header = document.createElement("div");
    header.className = "trace-step-header";

    const title = document.createElement("h3");
    title.innerHTML = `<span class="step-num">${step.step}</span> ${step.server_name || step.server}`;
    header.appendChild(title);

    const meta = document.createElement("div");
    meta.className = "trace-meta";

    if (step.latency_ms) {
      meta.innerHTML += `<span>${step.latency_ms}ms</span>`;
    }
    if (step.response_code) {
      const badgeClass = step.response_code === "NOERROR" ? "badge-ok" : "badge-error";
      meta.innerHTML += `<span class="badge ${badgeClass}">${step.response_code}</span>`;
    }
    if (step.is_authoritative) {
      meta.innerHTML += `<span class="badge badge-auth">AUTHORITATIVE</span>`;
    }
    if (step.error) {
      meta.innerHTML += `<span class="badge badge-error">ERROR</span>`;
    }
    header.appendChild(meta);
    wrapper.appendChild(header);

    // Server IP
    if (step.server_name && step.server_name !== step.server) {
      const ipLine = document.createElement("div");
      ipLine.style.fontSize = "13px";
      ipLine.style.color = "var(--text-muted)";
      ipLine.style.marginBottom = "12px";
      ipLine.textContent = `IP: ${step.server}`;
      wrapper.appendChild(ipLine);
    }

    // Error message
    if (step.error) {
      const errorDiv = document.createElement("div");
      errorDiv.className = "status-error";
      errorDiv.style.marginTop = "8px";
      errorDiv.textContent = step.error;
      wrapper.appendChild(errorDiv);
    }

    // Answer section
    if (step.answer && step.answer.length) {
      const section = document.createElement("div");
      section.className = "trace-section";
      section.innerHTML = `<div class="trace-section-title">Answer (${step.answer.length})</div>`;

      const records = document.createElement("div");
      records.className = "trace-records";
      step.answer.forEach(rec => {
        const recordDiv = document.createElement("div");
        recordDiv.className = "trace-record";
        if (typeof rec === 'object') {
          recordDiv.innerHTML = `<span class="type">${rec.type}</span> ${rec.data} <span class="ttl">TTL: ${rec.ttl}</span>`;
        } else {
          recordDiv.textContent = rec;
        }
        records.appendChild(recordDiv);
      });
      section.appendChild(records);
      wrapper.appendChild(section);
    }

    // Authority section
    if (step.authority && step.authority.length) {
      const section = document.createElement("div");
      section.className = "trace-section";
      section.innerHTML = `<div class="trace-section-title">Authority (${step.authority.length})</div>`;

      const records = document.createElement("div");
      records.className = "trace-records";
      step.authority.forEach(rec => {
        const recordDiv = document.createElement("div");
        recordDiv.className = "trace-record";
        if (typeof rec === 'object') {
          recordDiv.innerHTML = `<span class="type">${rec.type}</span> ${rec.name} → ${rec.data}`;
        } else {
          recordDiv.textContent = rec;
        }
        records.appendChild(recordDiv);
      });
      section.appendChild(records);
      wrapper.appendChild(section);
    }

    // Additional section
    if (step.additional && step.additional.length) {
      const section = document.createElement("div");
      section.className = "trace-section";
      section.innerHTML = `<div class="trace-section-title">Additional / Glue (${step.additional.length})</div>`;

      const records = document.createElement("div");
      records.className = "trace-records";
      step.additional.forEach(rec => {
        const recordDiv = document.createElement("div");
        recordDiv.className = "trace-record";
        if (typeof rec === 'object') {
          recordDiv.innerHTML = `<span class="type">${rec.type}</span> ${rec.name} → ${rec.data}`;
        } else {
          recordDiv.textContent = rec;
        }
        records.appendChild(recordDiv);
      });
      section.appendChild(records);
      wrapper.appendChild(section);
    }

    output.appendChild(wrapper);
  });
};
</script>

</body>
</html>
